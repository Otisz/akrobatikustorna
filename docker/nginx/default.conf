server {
    # Same port inside and out, so a container sharing this one's network can
    # request http://localhost:8080, exactly as the developer's browser does.
    listen 8080;
    server_name _;

    # Bedrock serves from web/, never the project root.
    root /var/www/html/web;
    index index.php;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Must precede the FastCGI block: nginx takes the first matching regex location.
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }
}
