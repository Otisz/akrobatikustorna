services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
      - composer-cache:/tmp/composer
    environment:
      COMPOSER_HOME: /tmp/composer
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  node:
    # Builds the theme's Tailwind/Vite assets. Kept in a container so the project
    # still needs nothing installed on the host.
    image: node:22-alpine
    working_dir: /var/www/html/web/app/themes/base
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    volumes:
      - .:/var/www/html
      - node-modules:/var/www/html/web/app/themes/base/node_modules

  playwright:
    # End-to-end browser tests, the project's only testing seam. Kept out of
    # `docker compose up` by a profile, so tests run when asked for.
    profiles: [test]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    # Shares nginx's network namespace, so the site answers on http://localhost:8080
    # here too. See docs/adr/0004-browser-tests-are-the-only-testing-seam.md.
    network_mode: service:nginx
    working_dir: /var/www/html/tests
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"
    volumes:
      - .:/var/www/html
      - playwright-node-modules:/var/www/html/tests/node_modules
    depends_on:
      - nginx

  mysql:
    # Matches production, so problems surface locally rather than on the VPS (Virtual Private Server).
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  composer-cache:
  node-modules:
  playwright-node-modules:
